name: Synchronisation du site
on:
  schedule:
    - cron: '45 * * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Copier le site depuis jeremstyke.github.io
        run: |
          git clone --depth 1 https://github.com/jeremstyke/jeremstyke.github.io /tmp/src
          rm -rf docs
          mkdir -p docs
          cp -r /tmp/src/.work/demarches/site/. docs/
      - name: Publier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898499+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Synchronisation du site" && git push)
